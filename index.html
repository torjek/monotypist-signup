<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoTypist | Coming Soon</title>
    <meta name="description" content="MonoTypist is coming soon. Sign up to get notified when we launch.">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>
    <!-- Background glowing orbs for the premium effect -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main class="container">
        <img src="MonoTypist_logo_dark.png" alt="MonoTypist Logo" class="logo" id="brand-logo">
        
        <h1>Something beautiful is coming.</h1>
        <p>Be the first to be notified when the product is launching.</p>

        <!-- Formspree Endpoint Form. User needs to replace 'YOUR_FORM_ID' -->
        <form id="signup-form" action="https://formspree.io/f/xrpzbbdz" method="POST">
            <div class="form-group">
                <input 
                    type="email" 
                    id="email-input"
                    name="email" 
                    placeholder="Enter your email address" 
                    required 
                    aria-label="Email address"
                >
                <button type="submit" id="submit-btn">Notify Me</button>
            </div>
            <div id="form-message" class="message"></div>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
